<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Iliana Papadopoulou — architect, artist, creative developer" />
    <title>Iliana Papadopoulou</title>
  </head>
  <body class="light">

    <!-- The Three.js canvas will be appended here by main.js -->
    <div id="canvas-container"></div>

    <!-- Navigation overlay (sits on top of the 3D canvas) -->
    <nav id="nav">
      <div class="nav-left">
        <a href="/">index</a>
        <a href="/info.html">info</a>
      </div>
      <div class="nav-center">
        <span class="nav-label" aria-label="view">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </span>
        <button class="view-toggle active" data-view="spatial">spatial</button>
        <button class="view-toggle" data-view="sequential">sequential</button>
      </div>
      <div class="nav-right">
        <span class="nav-label" aria-label="tags">#</span>
        <button class="filter-btn" data-category="all">all</button>
        <button class="filter-btn" data-category="interactive">interactive</button>
        <button class="filter-btn" data-category="data&visuals">data&amp;visuals</button>
        <button class="filter-btn" data-category="research">research</button>
      </div>
    </nav>

    <!-- Zoom hint icon — fades out when the intro animation ends -->
    <div id="zoom-hint" aria-hidden="true" style="width:80px;height:80px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="80" height="80" fill="none"
           stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13" cy="13" r="9" />
        <line x1="20" y1="20" x2="28" y2="28" />
        <line x1="8" y1="13" x2="18" y2="13" />
        <polyline points="10,11 8,13 10,15" />
        <polyline points="16,11 18,13 16,15" />
      </svg>
    </div>

    <!-- Sequential list view (hidden by default) -->
    <div id="sequential-view"></div>

    <!-- Project title that appears when hovering a card -->
    <div id="card-label"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
